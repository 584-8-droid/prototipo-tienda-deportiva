<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Nuevo Producto' if modo == 'nuevo' else 'Editar Producto' }}</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-card { max-width:600px; margin:40px auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-weight:600; margin-bottom:6px; color:#333; }
        .form-group input, .form-group textarea, .form-group select { width:100%; padding:10px 14px; border:1.5px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; }
        .form-group textarea { resize:vertical; min-height:90px; }
        .btn-primary { background:#e63946; color:#fff; border:none; padding:12px 28px; border-radius:8px; font-size:16px; cursor:pointer; font-weight:700; }
        .btn-secondary { background:#6c757d; color:#fff; border:none; padding:12px 22px; border-radius:8px; font-size:15px; cursor:pointer; margin-left:10px; text-decoration:none; display:inline-block; }
        .alert-error { background:#ffe3e3; border:1px solid #e63946; border-radius:8px; padding:12px 16px; margin-bottom:18px; color:#c0392b; }
        h2 { color:#e63946; margin-bottom:24px; }
    </style>
</head>
<body>
<div class="form-card">
    <h2>{{ '➕ Nuevo Producto' if modo == 'nuevo' else '✏️ Editar Producto' }}</h2>

    {% if errores %}
    <div class="alert-error">
        {% for e in errores %}<p style="margin:4px 0">⚠️ {{ e }}</p>{% endfor %}
    </div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Título *</label>
            <input type="text" name="titulo" required
                   value="{{ producto.titulo if producto else '' }}"
                   placeholder="Ej: Balón de Fútbol Profesional">
        </div>
        <div class="form-group">
            <label>Descripción *</label>
            <textarea name="descripcion" required
                      placeholder="Describe el producto...">{{ producto.descripcion if producto else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>Precio (Bs.) *</label>
            <input type="number" step="0.01" min="0" name="precio" required
                   value="{{ producto.precio if producto else '' }}"
                   placeholder="0.00">
        </div>
        <div class="form-group">
            <label>Categoría *</label>
            <select name="categoria" required>
                <option value="">-- Selecciona una categoría --</option>
                {% for cat in ['Fútbol','Baloncesto','Natación','Atletismo','Gimnasio','Ciclismo','Boxeo','Otros'] %}
                <option value="{{ cat }}"
                    {% if producto and producto.categoria == cat %}selected{% endif %}>
                    {{ cat }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Stock (unidades)</label>
            <input type="number" min="0" name="stock"
                   value="{{ producto.stock if producto else '0' }}">
        </div>
        <div class="form-group">
            <label>URL de Imagen (opcional)</label>
            <input type="url" name="imagen_url"
                   value="{{ producto.imagen_url if producto and producto.imagen_url else '' }}"
                   placeholder="https://...">
        </div>
        <button type="submit" class="btn-primary">
            {{ '✅ Registrar Producto' if modo == 'nuevo' else '💾 Guardar Cambios' }}
        </button>
        <a href="/mis-productos" class="btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
